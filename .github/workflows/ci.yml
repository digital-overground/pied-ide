name: Pied CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to validate"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pied-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: "9"

      - name: Install Rust toolchain
        run: rustup show

      - name: Check Prettier formatting
        run: ./script/prettier

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check tracked TODO markers
        run: ./script/check-todos

      - name: Check keymaps
        run: ./script/check-keymaps

      - name: Check typos
        uses: crate-ci/typos@96d9af6217dc2855210655af7e1ff19d23d4e593
        with:
          config: ./typos.toml

  workflow:
    name: Workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: ./script/shellcheck-scripts error

      - name: Install actionlint
        id: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Check workflows
        env:
          ACTIONLINT_BIN: ${{ steps.actionlint.outputs.executable }}
        run: '"$ACTIONLINT_BIN" -color'

  quality_gate:
    name: Quality gate
    needs:
      - style
      - workflow
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks passed
        env:
          STYLE_RESULT: ${{ needs.style.result }}
          WORKFLOW_RESULT: ${{ needs.workflow.result }}
        run: |
          set -euo pipefail
          test "$STYLE_RESULT" = "success"
          test "$WORKFLOW_RESULT" = "success"
