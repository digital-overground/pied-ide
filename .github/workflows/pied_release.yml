name: Pied IDE Release

on:
  push:
    tags:
      - "pied-v*"
      - "!pied-v*-alpha.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable release tag, such as pied-v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pied-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi

          if [[ ! "$tag" =~ ^pied-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tags must look like pied-v1.2.3, got $tag"
            exit 1
          fi

          git rev-parse "$tag" >/dev/null
          crate_version="$(script/get-crate-version zed)"
          if [[ "$tag" != "pied-v$crate_version" ]]; then
            echo "::error::Tag $tag does not match crates/zed version pied-v$crate_version"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          previous_tag="$(git describe --tags --match 'pied-v*' --exclude '*-alpha.*' --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$TAG"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$TAG"
          else
            range="$TAG"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          fi

          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/script/install.sh | sh"
            echo '```'
            echo
            echo "## Changes"
            echo
            git log --pretty=format:"- %s (%h)" "$range"
            echo
            echo
            echo "[Full Changelog]($changelog_url)"
          } > release-notes.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --draft
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file release-notes.md
          fi

  quality_gate:
    name: Quality gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}

  build_macos_aarch64:
    name: Build macOS Apple Silicon
    needs:
      - prepare
      - quality_gate
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.target_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Build macOS bundle
        run: ./script/bundle-mac aarch64-apple-darwin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pied-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Pied-aarch64.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-remote-server-macos-aarch64.gz
          path: target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build_macos_aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-artifacts/* --clobber
          gh release edit "$TAG" --draft=false
