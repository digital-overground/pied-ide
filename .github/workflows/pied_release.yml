name: Pied IDE Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching crates/zed/Cargo.toml, such as pied-v1.0.0"
        default: "pied-v1.0.0"
        required: true
        type: string
      ref:
        description: "Git ref to build"
        default: "main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pied-release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  quick_checks:
    name: Quick checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  prepare:
    name: Prepare release
    needs: quick_checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Create or update draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^pied-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like pied-v1.0.0, got $TAG"
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            target_sha="$existing_sha"
          else
            target_sha="$(git rev-parse HEAD)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$target_sha" >/dev/null
          fi

          git checkout --detach "$target_sha"
          crate_version="$(script/get-crate-version zed)"
          if [[ "$TAG" != "pied-v$crate_version" ]]; then
            echo "::error::Tag $TAG does not match crates/zed version pied-v$crate_version"
            exit 1
          fi

          previous_tag="$(git tag --merged "$target_sha^" --list 'pied-v*' --sort=-v:refname | grep -E '^pied-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$target_sha"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$TAG"
          else
            range="$target_sha"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          fi

          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/script/install.sh | sh"
            echo '```'
            echo
            echo "## Build"
            echo
            echo "- Requested ref: \`$BUILD_REF\`"
            echo "- Source tag: \`$TAG\`"
            echo "- Commit: \`$target_sha\`"
            echo
            echo "## Changes"
            echo
            git log --max-count=100 --pretty=format:"- %s (%h)" "$range"
            echo
            echo
            echo "[Full Changelog]($changelog_url)"
          } > release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes-file release-notes.md
          fi

          {
            echo "tag=$TAG"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

  build_macos_aarch64:
    name: Build macOS Apple Silicon
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.target_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Build macOS bundle
        run: ./script/bundle-mac aarch64-apple-darwin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pied-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Pied-aarch64.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-remote-server-macos-aarch64.gz
          path: target/zed-remote-server-macos-aarch64.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build_macos_aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
